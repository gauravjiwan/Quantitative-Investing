[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-investing-ps1"
version = "0.1.0"
description = "Private research workspace for Quantitative Investing Problem Set 1"
requires-python = ">=3.11,<3.14"
dependencies = [
  "wrds>=3.1",
  "sqlalchemy>=2.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "duckdb>=1.0",
  "pyarrow>=14",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "reportlab>=4.0",
  "pandas-datareader>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]
